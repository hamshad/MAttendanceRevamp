# Release signing config. Safe to commit: NO real passwords in this file.
# Real passwords come from env vars at build time (see android/app/build.gradle.kts):
#   MATTENDANCE_STORE_PASSWORD / MATTENDANCE_KEY_PASSWORD
# The .jks file itself is gitignored — back it up securely (password manager + offline copy).
keyAlias=mattendance
storeFile=upload-keystore.jks
storePassword=REPLACE_WITH_REAL_PASSWORD
keyPassword=REPLACE_WITH_REAL_PASSWORD
